<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Spell Checker</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --white: #ffffff;
            --bg: #f4f1ec;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Kantumruy Pro', sans-serif;
            touch-action: manipulation; /* iOS Safari: remove 300ms tap-delay on buttons/cards */
        }
        html { -webkit-text-size-adjust: 100%; }
        body { -webkit-overflow-scrolling: touch; }
        html, body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: var(--bg);
            color: #1e293b; font-size: 17px;
        }
        /* Wrapper — full width on all screens */
        .app-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }
        /* Content Area */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 30px;
            scrollbar-width: none;
        }
        main::-webkit-scrollbar { display: none; }
        .tab-panel { display: none; animation: slideUp 0.3s ease-out; }
        .tab-panel.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card Style */
        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* Editor / Textarea Styles */
        .editor-container {
            position: relative;
            margin-bottom: 15px;
        }

        .khmer-editor {
            width: 100%;
            min-height: 200px;
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px;
            font-size: 18px;
            line-height: 1.8;
            outline: none;
            word-wrap: break-word;
			white-space: pre-wrap; /* រក្សាដកឃ្លា និងចុះបន្ទាត់ដែលបង្កប់ក្នុង Text */
			word-break: break-word; /* បង្ការការរុញ Content ចេញក្រៅ Frame */
			display: block;
			min-height: 200px; /* តាមតម្រូវការរបស់អ្នក */
            transition: border 0.3s;
        }
        .khmer-editor:focus { border-color: var(--primary); }
        .khmer-editor[placeholder]:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
        }

        /* Spell Highlighting */
        .misspelled {
            border-bottom: 2.5px solid #dc2626;
            background: rgba(220,38,38,0.14);
			color: #991b1b;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-outline { background: #f1f5f9; color: var(--secondary); margin-top: 10px; }
        .site-header {
            position: sticky;
            top: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 18px;
            background: var(--bg);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .site-brand { display: flex; align-items: center; gap: 10px; }
        .site-name { font-size: 17px; font-weight: 700; color: #1e293b; white-space: nowrap; }
        /* Bottom Sheet Popup */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none; z-index: 1000;
            backdrop-filter: blur(2px);
        }
        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: white; border-radius: 30px 30px 0 0;
            padding: 20px; z-index: 1001; transition: 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
            max-height: 50vh; overflow-y: auto;
        }
        .bottom-sheet.active { bottom: 0; }
        .sheet-handle { width: 50px; height: 5px; background: #e2e8f0; border-radius: 10px; margin: 0 auto 15px; }

        .suggestion-list { display: flex; flex-direction: column; gap: 10px; }
        .suggestion-item {
            padding: 15px; background: #f8fafc; border-radius: 12px;
            font-weight: 600; font-size: 18px; color: var(--primary);
            text-align: center; border: 1px solid #e2e8f0;
        }
        .suggestion-item:active { background: var(--primary-light); }
        /* ══ Spell tab full-screen layout ══ */
        /* #tab-spell is hidden by .tab-panel {display:none}
           Only show as flex when it has .active class */
        #tab-spell.active {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);   /* full screen minus header + nav */
        }
        #tab-spell .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 14px;
            margin-bottom: 0;
            overflow: visible;
            min-height: 0;
        }
        #tab-spell .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-bottom: 10px;
            min-height: 0;
            overflow: hidden;
        }
        #tab-spell .khmer-editor {
            flex: 1;
            min-height: 0;
            height: 100%;
            resize: none;
            font-size: 18px;
            line-height: 1.9;
            overflow-y: auto;
        }
        /* Copy + Paste icon bar */
        .spell-icon-bar {
            display: flex;
            gap: 6px;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
        .spell-icon-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .spell-icon-btn:hover { background: #bfdbfe; }
        .spell-icon-btn:active { opacity: 0.8; }
        /* Bottom button row */
        .spell-btn-row {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .spell-btn-row .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }
        #tab-spell .btn-outline { margin-top: 0; }

        /* ── Header brand (single-tool version) ── */
        .brand-ico {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            background: #9333ea; color: #fff; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        #tab-spell.active { height: calc(100dvh - 140px); }

        /* ── Gemini layer: status line, loading, sheet notes ── */
        .btn:disabled { opacity: 0.7; cursor: default; }
        .ai-status { text-align: center; font-size: 14px; color: #64748b; margin: 8px 0 0; min-height: 20px; }
        .ai-status.ok { color: #15803d; }
        .ai-status.error { color: #b45309; }
        .ai-note {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 10px 12px; margin-bottom: 12px;
            font-size: 15px; line-height: 1.6; color: #475569;
        }
        .ai-badge {
            display: inline-block; padding: 1px 10px; margin-right: 6px; border-radius: 20px;
            font-size: 13px; font-weight: 700; background: var(--primary-light); color: var(--primary);
        }
        .ai-badge.grammar, .ai-badge.context { background: #fef3c7; color: #b45309; }
        .ai-badge.proper_noun, .ai-badge.valid { background: #dcfce7; color: #15803d; }
        .ai-mark { font-size: 13px; margin-right: 6px; opacity: 0.85; }

    </style>

    <!-- Ministry glossary (window.DICTIONARY_DATA). Optional: if it fails to load, the built-in list still works. -->
    <script src="wordlist.txt"></script>
</head>
<body>

<div class="app-container">
    <header class="site-header">
        <div class="site-brand">
            <div class="brand-ico"><i class="fa-solid fa-spell-check"></i></div>
            <span class="site-name">Khmer Spell Checker</span>
        </div>
    </header>

    <main id="main-content">
        <div id="tab-spell" class="tab-panel active">
            <div class="card">
                <div class="editor-container">
                    <!-- Copy + Paste icon buttons -->
                    <div class="spell-icon-bar">
                        <button class="spell-icon-btn" onclick="copyText('spell-editor')" title="ចម្លងអត្ថបទ">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button class="spell-icon-btn" onclick="pasteToEditor()" title="បិទភ្ជាប់អត្ថបទ">
                            <i class="fa-regular fa-clipboard"></i>
                        </button>
                    </div>
                    <div id="spell-editor" class="khmer-editor" contenteditable="true" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off" placeholder="សូមបញ្ចូលអត្ថបទខ្មែរនៅទីនេះ..."></div>
                </div>
                <div class="spell-btn-row">
                    <button class="btn btn-primary" id="check-btn" onclick="runFullCheck()">
                        <i class="fa-solid fa-wand-magic-sparkles" id="check-btn-icon"></i> ត្រួតពិនិត្យ
                    </button>
                    <button class="btn btn-outline" onclick="clearAll()">
                        <i class="fa-solid fa-eraser"></i> សម្អាត
                    </button>
                </div>
            </div>
            <p style="text-align: center; font-size: 14px; color: #64748b;">
                <i class="fa-solid fa-circle-info"></i> ចុចលើពាក្យដែលមាន <span style="color:red; text-decoration: underline dotted;">គូសបន្ទាត់ក្រហម</span> ដើម្បីកែតម្រូវពាក្យ
            </p>
            <p class="ai-status" id="ai-status" aria-live="polite"></p>
        </div>
    </main>

    <!-- Suggestion sheet -->
    <div class="overlay" id="overlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="sheet">
        <div class="sheet-handle"></div>
        <div id="sheet-content"></div>
    </div>
</div>

    // together as ONE unit — prevents orphaned diacritics in maxMatch.
    // e.g.: ស្ទ→['ស្ទ']  ហ្វ→['ហ្វ']  ជំ→['ជំ']  ម្ម→['ម្ម']  ធ្វើ→['ធ្វើ']
    const KH_SYL_SRC = "([\u1780-\u17A2\u17A5-\u17B3])(?:\u17D2[\u1780-\u17A2\u17A5-\u17B3])*(?:[\u17B6-\u17C5])?[\u17C6-\u17C9\u17CB-\u17D1\u17D3]?";

    // Split string into syllable units (Khmer) + individual chars (non-Khmer/punct)
    function toUnits(str) {
        const s = str.normalize("NFC");
        const units = [];
        let last = 0;
        const re = new RegExp(KH_SYL_SRC, "g");
        let m;
        while ((m = re.exec(s)) !== null) {
            if (m.index > last) units.push(...[...s.slice(last, m.index)]);
            units.push(m[0]);
            last = m.index + m[0].length;
        }
        if (last < s.length) units.push(...[...s.slice(last)]);
        return units;
    }

    // Escape for HTML attribute value
    function esc(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function errSpan(s) {
        const e = esc(s);
        return `<span class="misspelled" ontouchstart="handleMisspelledTouch(event,this,'${e}')" onclick="handleMisspelledTouch(event,this,'${e}')">${s}</span>`;
    }

    // ── maxMatch using syllable units ─────────────────────────────
    // Tries longest combination of syllable units in WSET first (greedy left-to-right)
    function maxMatch(str) {
        const units = toUnits(str);
        const n = units.length;
        const results = [];
        let i = 0;
        while (i < n) {
            let found = false;
            for (let len = Math.min(30, n - i); len >= 1; len--) {
                const chunk = units.slice(i, i + len).join("").normalize("NFC");
                if (WSET.has(chunk)) {
                    results.push({ text: chunk, error: false });
                    i += len;
                    found = true;
                    break;
                }
            }
            if (!found) {
                // Unknown: collect syllable units until next dict-word starts
                let errStr = units[i++];
                while (i < n) {
                    let peekOk = false;
                    for (let len = Math.min(30, n - i); len >= 1; len--) {
                        if (WSET.has(units.slice(i, i + len).join("").normalize("NFC"))) {
                            peekOk = true; break;
                        }
                    }
                    if (peekOk) break;
                    errStr += units[i++];
                }
                results.push({ text: errStr, error: true });
            }
        }
        return results;
    }

    // ── Tokenize line: split on spaces + punctuation ──────────────
    const DELIM_RE = /([ \t\u00A0\u200B\u00AB\u00BB\u2018-\u201F\u2026\u0021-\u002F\u003A-\u0040\u005B-\u0060\u007B-\u007E\u17D4-\u17DA\u17DC\u17DD]+)/;
    function tokenizeLine(line) {
        const segs = [];
        for (const p of line.split(DELIM_RE)) {
            if (!p) continue;
            segs.push({ type: DELIM_RE.test(p) ? 'delim' : 'word', val: p });
        }
        return segs;
    }

    // ── Process lines ─────────────────────────────────────────────
    const lines = text.split(/\r?\n/);
    let finalHtml = "";

    lines.forEach((line, idx) => {
        if (line.trim() === "" && idx < lines.length - 1) {
            finalHtml += "<br>";
            return;
        }

        let lineHtml = "";

        for (const seg of tokenizeLine(line)) {
            if (seg.type === 'delim') {
                lineHtml += seg.val.replace(/ /g, '&nbsp;');
                continue;
            }

            const norm = seg.val.normalize("NFC");

            // ① Direct dictionary hit → correct, output as-is
            if (WSET.has(norm)) {
                lineHtml += norm;
                continue;
            }

            // ② Not in dict → run syllable-based maxMatch
            //    Sub-matches found in dict → pass through
            //    Residuals not in dict → highlight as error
            const parts = maxMatch(norm);
            for (const p of parts) {
                lineHtml += p.error ? errSpan(p.text) : p.text;
            }
        }

        finalHtml += lineHtml + (idx < lines.length - 1 ? "<br>" : "");
    });

    editor.innerHTML = finalHtml;
}


    /** 📚 wordlist.txt (Ministry glossary) — extra known words for layer 1.
     *  Additive only: the spell-check algorithm above is untouched.
     *  Set to false to use only the built-in KHMER_WORDLIST as before. **/
    const MERGE_WORDLIST_TXT = true;
    (function mergeGlossary() {
        if (!MERGE_WORDLIST_TXT || !Array.isArray(window.DICTIONARY_DATA)) return;
        for (const entry of window.DICTIONARY_DATA) {
            const w = entry && typeof entry.word === 'string' ? entry.word.normalize("NFC").trim() : "";
            if (w && !/\s/.test(w)) window._SPELL_SET.add(w);
        }
    })();

    /** 🤖 GEMINI — SECOND LAYER (via Netlify Function; no API key in the browser) **
     *  Layer 1 (wordlist) always runs first, synchronously, and is never blocked
     *  or altered by layer 2. If Gemini fails, the red underlines simply stay. **/
    const AI_ENDPOINT   = '/.netlify/functions/check-khmer';
    const AI_TIMEOUT_MS = 12000;   // frontend timeout (function itself aborts Gemini at ~8.5s)
    const AI_MAX_ITEMS  = 25;      // max suspicious words sent per check
    const AI_TYPE_LABEL = {
        spelling: 'អក្ខរាវិរុទ្ធ', grammar: 'វេយ្យាករណ៍', context: 'បរិបទ',
        proper_noun: 'ឈ្មោះ ឬពាក្យបច្ចេកទេស', valid: 'ត្រឹមត្រូវ'
    };
    const AI_ERR_MSG = {
        timeout:      'AI ឆ្លើយតបយឺតពេក — កំពុងប្រើវចនានុក្រមតែប៉ុណ្ណោះ',
        rate_limited: 'AI មានការប្រើប្រាស់ច្រើនពេក សូមព្យាយាមម្តងទៀតបន្តិចក្រោយ — កំពុងប្រើវចនានុក្រមតែប៉ុណ្ណោះ',
        default:      'មិនអាចប្រើ AI បានទេ — កំពុងប្រើវចនានុក្រមតែប៉ុណ្ណោះ'
    };
    // Same delimiter set the wordlist tokenizer uses: spaces + punctuation
    const AI_DELIM_CLASS = ' \\t\\u00A0\\u200B\\u00AB\\u00BB\\u2018-\\u201F\\u2026\\u0021-\\u002F\\u003A-\\u0040\\u005B-\\u0060\\u007B-\\u007E\\u17D4-\\u17DA\\u17DC\\u17DD';
    const AI_DELIM_RE   = new RegExp('([' + AI_DELIM_CLASS + ']+)');
    const AI_DELIM_CHAR = new RegExp('[' + AI_DELIM_CLASS + ']');

    const aiInfo = new Map();        // word -> { word, suggestions, type, reason }
    const aiBatchCache = new Map();  // request JSON -> results (re-checking same text costs 0 API calls)
    let aiSeq = 0;                   // ignores stale responses
    let aiPending = false;
    let selectedMisspelledNode = null;
    let currentSheetWord = null;

    function setAiStatus(kind, msg) {
        const el = document.getElementById('ai-status');
        el.className = 'ai-status' + (kind ? ' ' + kind : '');
        el.textContent = msg || '';
    }

    function setAiLoading(on) {
        aiPending = on;
        const btn = document.getElementById('check-btn');
        const icon = document.getElementById('check-btn-icon');
        btn.disabled = on;
        icon.className = on ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-wand-magic-sparkles';
        if (on) setAiStatus('', 'កំពុងពិនិត្យបន្ថែមជាមួយ AI…');
    }

    const isTokenPart = n => !!n && (n.nodeType === 3 || (n.nodeType === 1 && n.classList.contains('misspelled')));

    /** The whole space/punctuation-delimited word a red-underlined fragment belongs to.
     *  (The wordlist layer can underline only a piece of a misspelled word.) */
    function tokenAround(span) {
        let left = '', right = '';
        for (let n = span.previousSibling; isTokenPart(n); n = n.previousSibling) {
            const t = n.textContent;
            let i = t.length;
            while (i > 0 && !AI_DELIM_CHAR.test(t[i - 1])) i--;
            left = t.slice(i) + left;
            if (i > 0) break;
        }
        for (let n = span.nextSibling; isTokenPart(n); n = n.nextSibling) {
            const t = n.textContent;
            let i = 0;
            while (i < t.length && !AI_DELIM_CHAR.test(t[i])) i++;
            right += t.slice(0, i);
            if (i < t.length) break;
        }
        return (left + span.textContent + right).normalize('NFC');
    }

    /** Replace all pieces of one word (underlined fragments + the words between them)
     *  with a single underlined span, so a suggestion replaces the WHOLE word. */
    function mergeToken(span) {
        const nodes = [span];
        for (let n = span.previousSibling; isTokenPart(n); ) {
            const prev = n.previousSibling, t = n.textContent;
            let i = t.length;
            while (i > 0 && !AI_DELIM_CHAR.test(t[i - 1])) i--;
            if (i > 0) { if (i < t.length && n.nodeType === 3) nodes.unshift(n.splitText(i)); break; }
            nodes.unshift(n);
            n = prev;
        }
        for (let n = span.nextSibling; isTokenPart(n); ) {
            const next = n.nextSibling, t = n.textContent;
            let i = 0;
            while (i < t.length && !AI_DELIM_CHAR.test(t[i])) i++;
            if (i < t.length) { if (i > 0 && n.nodeType === 3) { n.splitText(i); nodes.push(n); } break; }
            nodes.push(n);
            n = next;
        }
        if (nodes.length === 1) return span;
        const merged = makeMisspelledSpan(nodes.map(x => x.textContent).join('').normalize('NFC'));
        const range = document.createRange();
        range.setStartBefore(nodes[0]);
        range.setEndAfter(nodes[nodes.length - 1]);
        range.deleteContents();
        range.insertNode(merged);
        return merged;
    }

    /** Only unknown Khmer words (+ their sentence) are sent — never the whole document. */
    function buildAiItems(editor) {
        const text = editor.innerText.replace(/\u00A0/g, ' ').normalize('NFC');
        const sentences = text.split(/[។៕!?\n\r]+/).map(s => s.trim()).filter(Boolean);
        const seen = new Set();
        const items = [];
        editor.querySelectorAll('.misspelled').forEach(span => {
            const word = tokenAround(span).trim();
            if (!word || seen.has(word) || items.length >= AI_MAX_ITEMS) return;
            if (!/[\u1780-\u17FF]/.test(word)) return;          // skip non-Khmer tokens
            seen.add(word);
            let ctx = sentences.find(s => s.includes(word)) || word;
            if (ctx.length > 200) {
                const i = ctx.indexOf(word);
                ctx = ctx.slice(Math.max(0, i - 90), Math.min(ctx.length, i + word.length + 90));
            }
            items.push({ word, context: ctx });
        });
        return items;
    }

    async function fetchAi(items) {
        const key = JSON.stringify(items);
        if (aiBatchCache.has(key)) return aiBatchCache.get(key);

        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), AI_TIMEOUT_MS);
        let res, data = null;
        try {
            res = await fetch(AI_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items }),
                signal: ctl.signal
            });
            try { data = await res.json(); } catch (_) {}
        } catch (e) {
            throw new Error(e && e.name === 'AbortError' ? 'timeout' : 'network');
        } finally {
            clearTimeout(timer);
        }
        if (!res.ok || !data || !Array.isArray(data.results)) {
            throw new Error(res.status === 429 ? 'rate_limited' : ((data && data.error) || 'upstream_error'));
        }
        if (aiBatchCache.size >= 20) aiBatchCache.delete(aiBatchCache.keys().next().value);
        aiBatchCache.set(key, data.results);
        return data.results;
    }

    /** Same red-underline span + same click behaviour as layer 1 */
    function makeMisspelledSpan(word) {
        const s = document.createElement('span');
        s.className = 'misspelled';
        s.textContent = word;
        s.addEventListener('touchstart', e => handleMisspelledTouch(e, s, word), { passive: false });
        s.addEventListener('click', e => handleMisspelledTouch(e, s, word));
        return s;
    }

    /** Underline a context/grammar error Gemini found in a word the wordlist accepted.
     *  Whole-token match only, first occurrence only — avoids false hits inside other words. */
    function flagWordInEditor(editor, word) {
        const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
            acceptNode: n => (n.parentElement && n.parentElement.closest('.misspelled'))
                ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
        });
        let node;
        while ((node = walker.nextNode())) {
            const parts = node.nodeValue.split(AI_DELIM_RE);   // even index = token, odd = delimiter
            let offset = 0;
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0 && parts[i].normalize('NFC') === word) {
                    const target = node.splitText(offset);
                    target.splitText(parts[i].length);
                    target.replaceWith(makeMisspelledSpan(parts[i]));
                    return true;
                }
                offset += parts[i].length;
            }
        }
        return false;
    }

    function applyAiResults(editor, items, results) {
        const sent = new Set(items.map(i => i.word));
        let n = 0;
        results.forEach(r => {
            aiInfo.set(r.word, r);
            const realIssue = r.type !== 'valid' && r.type !== 'proper_noun';
            if (sent.has(r.word)) {
                if (realIssue) {
                    [...editor.querySelectorAll('.misspelled')].forEach(sp => {
                        if (sp.isConnected && tokenAround(sp) === r.word) mergeToken(sp);
                    });
                }
            } else if (realIssue) {
                flagWordInEditor(editor, r.word);
            }
            if ((r.suggestions && r.suggestions.length) || r.reason) n++;
        });
        return n;
    }

    async function runGeminiLayer() {
        const editor = document.getElementById('spell-editor');
        const seq = ++aiSeq;
        aiInfo.clear();

        const items = buildAiItems(editor);
        if (!items.length) { setAiStatus('', ''); return; }   // nothing suspicious → no API call

        setAiLoading(true);
        try {
            const results = await fetchAi(items);
            if (seq !== aiSeq) return;
            const n = applyAiResults(editor, items, results);
            setAiStatus('ok', n ? 'AI បានវិភាគ ' + n + ' ពាក្យ — ចុចលើពាក្យគូសក្រហមដើម្បីមើលការណែនាំ'
                                : 'AI មិនមានការណែនាំបន្ថែមទេ');
        } catch (err) {
            if (seq !== aiSeq) return;
            console.warn('Gemini layer unavailable:', err && err.message);
            setAiStatus('error', AI_ERR_MSG[err && err.message] || AI_ERR_MSG.default);
        } finally {
            if (seq === aiSeq) { setAiLoading(false); refreshSheetIfOpen(); }
        }
    }

    /** Button handler: layer 1 (instant, untouched) → layer 2 (Gemini, never throws) */
    async function runFullCheck() {
        const editor = document.getElementById('spell-editor');
        if (!editor.innerText || !editor.innerText.trim()) return;
        runSpellCheck();
        await runGeminiLayer();
    }

    function clearAll() {
        aiSeq++;                      // cancel any in-flight Gemini result
        aiInfo.clear();
        setAiLoading(false);
        setAiStatus('', '');
        clearSpellText();
    }

    /** Suggestion sheet — same markup/classes as before; AI suggestions come first */
    function showSuggestions(node, word) {
        selectedMisspelledNode = node;
        currentSheetWord = word;
        renderSheet(word, node);
        openSheet();
    }

    function refreshSheetIfOpen() {
        if (!currentSheetWord || !document.getElementById('sheet').classList.contains('active')) return;
        if (selectedMisspelledNode && !selectedMisspelledNode.isConnected) { closeSheet(); return; }
        renderSheet(currentSheetWord, selectedMisspelledNode);
    }

    function renderSheet(word, node) {
        const content = document.getElementById('sheet-content');
        content.textContent = '';

        const head = document.createElement('div');
        head.style.cssText = 'text-align:center; margin-bottom:15px;';
        const title = document.createElement('span');
        title.style.cssText = 'font-weight:700; color:#64748b;';
        title.textContent = 'ការកែតម្រូវសម្រាប់: "' + word + '"';
        head.appendChild(title);
        content.appendChild(head);

        let info = aiInfo.get(word);           // whole word is underlined → AI suggestions apply
        let noteOnly = false;
        if (!info && node) {                   // underlined fragment of a longer word → show the note, not replacements
            info = aiInfo.get(tokenAround(node));
            noteOnly = !!info;
        }
        if (info && (info.reason || info.type)) {
            const note = document.createElement('div');
            note.className = 'ai-note';
            const badge = document.createElement('span');
            badge.className = 'ai-badge ' + info.type;
            badge.textContent = AI_TYPE_LABEL[info.type] || info.type;
            note.appendChild(badge);
            note.appendChild(document.createTextNode(info.reason || ''));
            content.appendChild(note);
        } else if (aiPending) {
            const note = document.createElement('div');
            note.className = 'ai-note';
            note.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ';
            note.appendChild(document.createTextNode('កំពុងស្វែងរកការណែនាំពី AI…'));
            content.appendChild(note);
        }

        const list = document.createElement('div');
        list.className = 'suggestion-list';
        const seen = new Set([word]);
        let count = 0;
        const add = (s, fromAi) => {
            if (!s || seen.has(s) || count >= 8) return;
            seen.add(s); count++;
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            if (fromAi) {
                const mark = document.createElement('i');
                mark.className = 'fa-solid fa-wand-magic-sparkles ai-mark';
                mark.title = 'ការណែនាំពី AI';
                item.appendChild(mark);
            }
            item.appendChild(document.createTextNode(s));
            item.addEventListener('click', () => applySuggestion(s));
            list.appendChild(item);
        };
        (info && !noteOnly && info.suggestions ? info.suggestions : []).forEach(s => add(s, true));
        getLevenshteinSuggestions(word).forEach(s => add(s, false));

        if (count === 0) {
            const empty = document.createElement('div');
            empty.style.cssText = 'text-align:center; color:#94a3b8; padding:20px;';
            empty.textContent = 'មិនមានពាក្យណែនាំ';
            list.appendChild(empty);
        }
        content.appendChild(list);
    }

    function applySuggestion(word) {
        if (selectedMisspelledNode) {
            selectedMisspelledNode.replaceWith(document.createTextNode(word));   // text node: never parsed as HTML
            selectedMisspelledNode = null;
            closeSheet();
        }
    }


    	const editor = document.getElementById('spell-editor');

editor.addEventListener('paste', function (e) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    document.execCommand('insertText', false, text);
});

    	function handleMisspelledTouch(e, node, word) {
			if (e) e.preventDefault();

			const editor = document.getElementById('spell-editor');
			if (document.activeElement === editor) {
					editor.blur();
			}

			showSuggestions(node, word);
	}

        // Levenshtein on Unicode codepoint arrays (not JS char codes) — handles Khmer correctly
    function levenshtein(a, b) {
        const ca = [...a.normalize("NFC")], cb = [...b.normalize("NFC")];
        const m = ca.length, n = cb.length;
        const dp = Array.from({ length: m + 1 }, (_, i) => Array.from({ length: n + 1 }, (_, j) => j === 0 ? i : 0));
        for (let j = 1; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++)
            for (let j = 1; j <= n; j++)
                dp[i][j] = ca[i-1] === cb[j-1]
                    ? dp[i-1][j-1]
                    : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
        return dp[m][n];
    }

    function getLevenshteinSuggestions(word) {
        const nw = word.normalize("NFC");
        return KHMER_WORDLIST
            .map(w => ({ word: w, dist: levenshtein(nw, w.normalize("NFC")) }))
            .filter(item => item.dist <= 2)
            .sort((a, b) => a.dist - b.dist)
            .map(item => item.word)
            .slice(0, 5);
    }


        function clearSpellText() {
        const editor = document.getElementById('spell-editor');
        editor.innerHTML = "";
        editor.focus();
    }

        function openSheet() {
        document.getElementById('overlay').style.display = "block";
        document.getElementById('sheet').classList.add('active');
    }

        function closeSheet() {
        document.getElementById('overlay').style.display = "none";
        document.getElementById('sheet').classList.remove('active');
    }

        function copyText(id) {
        const el = document.getElementById(id);
        const text = el.innerText || el.value;
        if(!text) return;
        
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        
        // Custom snackbar style alert
        const snack = document.createElement('div');
        snack.innerText = "បានចម្លងរួចរាល់";
        snack.style = "position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:10px 20px; border-radius:20px; font-size:14px; z-index:5000;";
        document.body.appendChild(snack);
        setTimeout(() => snack.remove(), 2000);
    }

        function pasteToEditor() {
        const editor = document.getElementById('spell-editor');
        if (!editor) return;
        if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(text => {
                editor.focus();
                document.execCommand('insertText', false, text);
            }).catch(() => {
                editor.focus();
                document.execCommand('paste');
            });
        } else {
            editor.focus();
            document.execCommand('paste');
        }
    }
